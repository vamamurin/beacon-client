name: beacon_client
description: Museum Indoor Positioning App using iBeacon BLE signals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.4
  permission_handler: ^12.0.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  video_player: ^2.11.1
  http: ^1.6.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
