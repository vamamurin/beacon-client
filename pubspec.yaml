name: beacon_client
description: Museum Indoor Positioning App using iBeacon BLE signals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.4
  permission_handler: ^12.0.1
  provider: ^6.1.2
  video_player: ^2.11.1
  http: ^1.6.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  battery_plus: ^7.1.0
  archive: ^4.0.9
  crypto: ^3.0.7
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  audio_service: ^0.18.19
  flutter_foreground_task: ^10.0.0
  # QR "mang chuyến đi về nhà" ở màn tổng kết. Chỉ VẼ mã, không quét — không
  # kéo theo quyền camera nào.
  qr_flutter: ^4.1.0
  # BỘ DỰNG 3D ĐÃ CHỌN (chốt 18/08/2026 sau spike M0). Kéo theo webview_flutter
  # + url_launcher.
  #
  # Ứng viên còn lại, `flutter_scene`, đã bị loại BẰNG THỰC NGHIỆM chứ không
  # phải bằng lập luận: trên máy thực địa (PowerVR GE8300, KHÔNG có Vulkan) nó
  # khởi tạo được và phân tích glTF nhanh gấp đôi, nhưng ở khung hình đầu thì
  # backend OpenGL ES của Impeller gặp uniform sai kiểu và engine abort —
  # SIGABRT trên luồng raster, giết cả tiến trình cùng foreground service, BLE
  # và audio. WebView hỏng thì hệ điều hành hy sinh tiến trình khác và chuyến
  # tham quan sống; flutter_scene hỏng thì chuyến tham quan chết theo.
  #
  # ⚠ ĐÂY KHÔNG PHẢI KẾT LUẬN VĨNH VIỄN. Lỗi nằm ở backend GLES; trên máy CÓ
  # Vulkan thì flutter_scene mở lại được, và nó sẽ bỏ được ~200 MB Chromium mà
  # gói này bắt buộc phải trả (§8 trong docs/M0-baseline.md). Nếu cấu hình máy
  # giao đổi, đo lại trước khi coi lựa chọn này là đã xong.
  #
  # GHIM CỨNG, không dấu `^`: đây là bản đã đo trên máy thực địa, và một bản vá
  # tự trôi vào sẽ làm mọi số đo trong docs/M0-baseline.md nói về một thứ khác.
  model_viewer_plus: 1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  fonts:
  - family: CormorantGaramond
    fonts:
      - asset: assets/fonts/CormorantGaramond-Regular.ttf
        weight: 400
      - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/CormorantGaramond-Bold.ttf
        weight: 700

  assets:
    - assets/audio/
